name: Prepared release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: prepared-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require the exact tested source and prepare publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          state=$(python3 tools/prepare_release_publication.py "$RELEASE_SHA")
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Build UI and qualify pinned worker images
        if: steps.publication.outputs.state == 'build'
        run: python3 tools/build_release_artifacts.py --output "$RUNNER_TEMP/forge-prepared"
      - name: Publish the complete release
        if: steps.publication.outputs.state == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "forge-build-$RELEASE_SHA" \
            --target "$RELEASE_SHA" --draft \
            --title "Forge $RELEASE_SHA" \
            --notes "Prepared Linux amd64 assets for the exact commit that passed CI. Worker images passed build-environment and isolation canaries. Installations verify asset checksums and repeat host qualification." \
            "$RUNNER_TEMP/forge-prepared/manifest.json" \
            "$RUNNER_TEMP/forge-prepared/forge-ui-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/forge-prepared/forge-runner-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/forge-prepared/forge-runner-full-linux-amd64.tar.gz"
          gh release edit "forge-build-$RELEASE_SHA" --draft=false
