name: Retired worker release publisher

# Keep this path registered so maintainers can disable its historical runs.
# Deleting the file leaves GitHub's old runs rerunnable but cannot be disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'Retired. Prepared UI releases use prepared-ui-release.yml.'
