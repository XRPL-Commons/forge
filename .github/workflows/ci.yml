name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Run the optional Chromium dashboard checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked private artifacts
        run: python3 tools/check_public_source.py
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and history with redacted findings
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Backend regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Observer regression tests
        run: python3 -m unittest discover -s observer/tests -v

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned browser test dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium and its system dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Dashboard regression tests
        env:
          FORGE_PLAYWRIGHT_MODULE: playwright-core
        run: npm run test:browser

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
