name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Run the optional Chromium dashboard checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Backend regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Observer regression tests
        run: python3 -m unittest discover -s observer/tests -v

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned browser test dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium and its system dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Dashboard regression tests
        env:
          FORGE_PLAYWRIGHT_MODULE: playwright-core
        run: npm run test:browser
