name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked private artifacts
        run: python3 tools/check_public_source.py
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and history with redacted findings
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .

  python-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Build checksum-pinned SQLite with the WAL fix
        shell: bash
        run: |
          # Keep the standard-library sqlite3 module; qualify its linked library.
          # https://www.sqlite.org/releaselog/3_51_3.html
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            --output "$RUNNER_TEMP/sqlite.tar.gz" \
            https://www.sqlite.org/2026/sqlite-autoconf-3510300.tar.gz
          echo "81f5be397049b0cae1b167f2225af7646fc0f82e4a9b3c48c9ea3a533e21d77a  $RUNNER_TEMP/sqlite.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/sqlite.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/sqlite-autoconf-3510300"
          ./configure --prefix="$RUNNER_TEMP/forge-sqlite" --disable-static --disable-readline
          make -j2
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/forge-sqlite/lib" >> "$GITHUB_ENV"
      - name: Verify linked SQLite
        run: python3 -c 'import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info == (3, 51, 3)'
      - name: Install Node for ECMAScript schema regressions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Backend regression tests
        run: python3 tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3
      - name: Observer regression tests
        if: matrix.shard == 0
        run: python3 -m unittest discover -s observer/tests -v

  python:
    # Preserve the required check name and require every backend group to pass.
    needs: python-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all backend groups
        run: test '${{ needs.python-shard.result }}' = 'success'

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright-core install chromium --with-deps
      - run: npm run test:e2e
        env:
          # GitHub's Ubuntu runners restrict unprivileged user namespaces; the runner VM is the sandbox.
          FORGE_CHROMIUM_SANDBOX: '0'
