name: Bug report
description: Report something in Forge that does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets.** Remove API keys, GitHub App private keys, tokens, cookies and provider logins before submitting. Worker output and service logs can contain tokens: redact them, or share only the lines that matter.

        Security vulnerabilities must not be reported here. Use **Report a vulnerability** on the repository's Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Forge revision
      description: The commit or release you are running.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or update
        - Operator UI
        - Workers and coding accounts
        - GitHub publication and merging
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redacted log lines or error messages. Check again that no tokens or keys are included.
      render: text
