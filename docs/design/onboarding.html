<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge · Setup design</title>
<style>
:root{color-scheme:dark;--bg:#101416;--panel:#192024;--line:#303b40;--text:#edf1ee;--muted:#acb7b9;--green:#bfe6cd;--green-bg:#243b30;--amber:#f1c17d;--amber-bg:#332a1d;--blue:#abcfff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:10px 16px}button:hover:not(:disabled){border-color:var(--muted)}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--green);border-color:var(--green);color:#15251b;font-weight:650}button.danger{background:var(--amber);border-color:var(--amber);color:#2b2010;font-weight:650}button.text{border:0;padding:6px 0;color:var(--muted)}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}a{color:var(--blue)}p{margin:8px 0 18px}h1{font-size:35px;line-height:1.16;letter-spacing:-1px;margin:10px 0 18px;font-weight:650;max-width:630px}h2{font-size:18px;margin:0 0 5px}h3{font-size:15px;margin:0}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--green);font-weight:650}.preview{padding:10px 28px;background:#1e2529;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.preview strong{color:var(--text);letter-spacing:.4px}.brandbar{max-width:1280px;margin:auto;padding:26px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:20px;letter-spacing:-.6px;font-weight:750;display:flex;gap:10px;align-items:center}.brand-mark{display:grid;place-content:center;width:26px;height:26px;border:1px solid var(--green);color:var(--green);font-size:16px;transform:rotate(-6deg);border-radius:5px}.header-actions{display:flex;align-items:center;gap:25px;font-size:12px}.header-actions a{color:var(--muted);text-decoration:none}.header-actions a:hover{color:var(--text);text-decoration:underline}.saved{font-size:12px;color:var(--muted)}.layout{max-width:1280px;margin:auto;padding:28px 32px 65px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:80px}.layout.solo{display:block;max-width:780px}.layout.solo aside{display:none}aside{padding-top:14px}nav{display:grid;gap:7px}nav button{display:flex;gap:13px;border:0;text-align:left;padding:13px 10px;width:100%;align-items:center;color:var(--muted)}nav button[aria-current=step]{background:var(--panel);color:var(--text)}.step-number{border:1px solid var(--line);width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0}.step-number.done{color:var(--green);background:var(--green-bg);border-color:var(--green-bg)}nav button[aria-current=step] .step-number{border-color:var(--green);color:var(--green)}.rail-note{border-top:1px solid var(--line);margin:25px 10px;padding-top:17px;color:var(--muted);font-size:12px;max-width:190px}.rail-note strong{display:block;color:var(--text);margin-bottom:5px}.content{max-width:760px;min-width:0}.intro{max-width:620px;color:var(--muted);font-size:16px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:25px 0;overflow:hidden}.row{display:flex;align-items:center;gap:15px;padding:19px 21px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.row small{display:block;color:var(--muted);font-size:13px;line-height:1.5}.row strong,.row h3{overflow-wrap:anywhere}.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.status.good{color:var(--green)}.status-icon{width:27px;height:27px;display:grid;place-content:center;flex-shrink:0;color:var(--muted)}.status-icon.good{color:var(--green)}.notice{display:flex;gap:12px;padding:16px 18px;background:var(--green-bg);border-radius:9px;color:var(--green);font-size:13px;margin:20px 0}.notice.neutral{background:var(--panel);color:var(--muted)}.notice.warn{background:var(--amber-bg);color:var(--amber)}.notice strong{display:block;color:inherit}.notice p{margin:0}.footer{border-top:1px solid var(--line);padding-top:22px;margin-top:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.footer-note{font-size:12px;color:var(--muted);max-width:355px}.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.selection{cursor:pointer}.selection:has(input:checked){background:#22332a}input[type=radio]{accent-color:var(--green);width:18px;height:18px;flex-shrink:0}.success-mark{width:46px;height:46px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;border-radius:50%;font-size:24px;margin-bottom:20px}.bullet-list{margin:20px 0;padding:0;list-style:none}.bullet-list li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.bullet-list li:last-child{border-bottom:0}.bullet-list span:first-child{color:var(--muted);min-width:20px}.bullet-list small{display:block;color:var(--muted);margin-top:3px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.flow div{font-size:12px;padding-top:12px;border-top:2px solid var(--line);color:var(--muted)}.flow .active{border-color:var(--green);color:var(--green)}details{font-size:13px;color:var(--muted);margin:20px 0}summary{cursor:pointer;width:fit-content}details p{margin:12px 0}dialog{color:var(--text);background:#1b2327;border:1px solid #48565b;border-radius:14px;padding:28px;width:min(510px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;box-shadow:0 24px 80px #0006}dialog::backdrop{background:#05090bcc}dialog h2{font-size:24px;letter-spacing:-.5px;margin:8px 0 16px}dialog p{color:var(--muted)}dialog .actions{margin-top:24px;justify-content:flex-end}dialog li{color:var(--muted);margin:8px 0}.spinner{display:inline-block;width:14px;height:14px;border:1.5px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:920px){.layout{grid-template-columns:175px minmax(0,1fr);gap:32px}}@media(max-width:660px){.preview{padding:10px 18px}.brandbar{padding:20px 18px}.header-actions{gap:15px}.saved{display:none}.layout{display:block;padding:8px 18px 35px}aside{padding:0}nav{display:flex;margin-bottom:26px;gap:5px}nav button{flex:1;width:auto;gap:8px;padding:10px 8px;font-size:12px}.step-number{width:23px;height:23px}.rail-note{display:none}h1{font-size:29px}.intro{font-size:15px}.row{gap:10px;padding:16px 13px;flex-wrap:wrap}.row .grow{min-width:145px}.row button{font-size:13px;padding:8px 12px}.status{font-size:11px}.footer{gap:15px}.footer .actions{width:100%;justify-content:space-between}.footer .primary,.footer .danger{flex:1}.footer-note{max-width:none}.panel{margin:20px 0}.flow{gap:8px}.flow div{font-size:11px}.preview span{display:block}}
</style>
</head>
<body>
<div class="preview"><strong>DESIGN PREVIEW</strong> <span>All data and actions are simulated. No real services, credentials or GitHub repositories are changed.</span></div>
<header class="brandbar"><div class="brand"><span class="brand-mark" aria-hidden="true">F</span> Forge</div><div class="header-actions"><span id="saved" class="saved">Draft saved on this device</span><a id="reset-link" href="#/reset">Reset Forge</a></div></header>
<div class="layout" id="layout"><aside><nav id="steps" aria-label="Setup progress"></nav><div class="rail-note"><strong>Connect. Start. Done.</strong>Forge picks up ready issues and runs the workflow. You can tune settings later.</div></aside><main class="content" id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='forge-onboarding-simple-v1',roleNames=['Builder','Reviewer','Auditor','Controller'];
const roleDescriptions=['Writes code and opens PRs','Checks correctness and tests','Checks security','Routes work and merges approved changes'];
const fresh=()=>({apps:0,repo:'example/site',provider:false,ready:false,checking:false,live:false,step:0,resetIndex:null,resetDone:false});
let s=fresh(),timer=null,returnFocus=null;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object'&&!Array.isArray(saved))s={...s,...saved};}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(s));}catch{$('saved').textContent='Browser storage unavailable';}}
function go(route){if(location.hash===route)render(true);else location.hash=route;}
function clearTimer(){clearTimeout(timer);timer=null;}
function heading(kicker,title,description){return `<span class="eyebrow">${kicker}</span><h1 tabindex="-1" id="screen-title">${title}</h1><p class="intro">${description}</p>`;}
function foot(label,action,note,disabled=false){return `<div class="footer"><span class="footer-note">${note}</span><div class="actions">${s.step>0&&!s.live?'<button class="text" data-action="back">Back</button>':''}<button class="primary" data-action="${action}" ${disabled?'disabled':''}>${label} <span aria-hidden="true">→</span></button></div>`;}
function status(text,good=false){return `<span class="status ${good?'good':''}">${good?'✓ ':''}${text}</span>`;}
function github(){return heading('1 · GitHub','Connect your GitHub workspace','You own the Apps and choose which repositories they can access. Forge handles the connection details.')+`<div class="panel">${roleNames.map((role,i)=>`<div class="row"><span class="status-icon ${i<s.apps?'good':''}">${i<s.apps?'✓':'○'}</span><div class="grow"><h3>${role}</h3><small>${roleDescriptions[i]}</small></div>${status(i<s.apps?'Connected':i===s.apps?'Next':'Not connected',i<s.apps)}</div>`).join('')}</div><p class="small muted">Four separate identities. One guided setup. No administrator token.</p>`+foot(s.apps===4?'Choose a repository':s.apps===0?'Connect GitHub':'Continue connecting',s.apps===4?'repository':'github',`${s.apps} of 4 identities connected. You can leave and resume.`);}
function repository(){return heading('2 · Repository','Where should Forge work?','Choose one repository to start with. You can add more later.')+`<div class="panel">${['example/site','example/api','example/docs'].map(repo=>`<label class="row selection"><input type="radio" name="repo" value="${repo}" ${s.repo===repo?'checked':''}><div class="grow"><h3>${repo}</h3><small>All four roles have access</small></div>${status('Verified',true)}</label>`).join('')}</div><p class="small muted">This list comes from your GitHub App installations.</p>`+foot('Continue','start-page','Selecting a repository does not start work.');}
function start(){return heading('3 · Start','Ready to put Forge to work?','Connect your coding provider. Forge will check the setup automatically.')+`<div class="panel"><div class="row"><div class="grow"><h3>Codex</h3><small>${s.provider?'Server authentication verified':'Connect your coding provider to run agents'}</small></div>${s.provider?status('Connected',true):'<button data-action="provider">Connect</button>'}</div><div class="row"><div class="grow"><h3>${esc(s.repo)}</h3><small>Process eligible issues labeled ready</small></div></div></div>${s.checking?'<div class="notice" role="status"><span class="spinner"></span><p>Checking the provider, repository rules and runner cleanup…</p></div>':s.ready?'<div class="notice" role="status"><span>✓</span><p><strong>Everything is ready.</strong>Provider, repository rules and runner lifecycle verified.</p></div>':'<p class="small muted">Setup checks use disposable local resources. They do not change your repository.</p>'}<details><summary>How Forge will work</summary><p>Build → Review → Security audit → Merge. Human approval is required when repository policy or the auditor calls for it.</p><p>Three failed attempts stop the issue for a human decision. Each failure is investigated. Capacity uses verified host limits.</p></details>`+foot('Start Forge','start',`Forge will pick up ready issues in ${esc(s.repo)}, create PRs, and merge them when required checks and approvals pass.`,!s.ready);}
function factory(){return heading('Factory is running','Forge is working',`Ready issues in <strong>${esc(s.repo)}</strong> can now move through the pipeline.`)+`<div class="panel"><div class="row"><span class="status-icon good">↗</span><div class="grow"><h3>Clarify local setup instructions</h3><small>${esc(s.repo)} · Issue #12</small></div>${status('Building',true)}</div><div style="padding:0 21px 21px"><div class="flow"><div class="active">Build · Working</div><div>Review</div><div>Audit</div><div>Merge</div></div></div></div><p class="small muted">4 more ready issues · 1 worker running</p><div class="notice neutral"><span>→</span><p>Setup is complete. In the product, this is the fleet dashboard.</p></div><p class="small muted">Use Reset Forge to try the fresh-start route.</p>`;}
function resetScreen(){return heading('Reset Forge','Start fresh','Stop this factory and return to a blank setup.')+`<ul class="bullet-list"><li><span>01</span><div><strong>Stop all Forge-managed work</strong><small>Pause scheduling and terminate every owned worker.</small></div></li><li><span>02</span><div><strong>Discard unfinished local work</strong><small>Remove disposable workspaces and pending factory work.</small></div></li><li><span>03</span><div><strong>Clear the current setup</strong><small>Remove selections, settings and Forge-owned credential copies.</small></div></li><li><span>04</span><div><strong>Keep your GitHub work</strong><small>Issues, commits, branches, PRs and App registrations remain.</small></div></li></ul><p class="small muted">Previous lifecycle history is archived. Shared credentials and unrelated host processes remain untouched.</p><div class="footer"><span class="footer-note">${s.live?'1 worker is currently running.':'No Forge workers are currently running.'}</span><div class="actions"><button data-action="cancel-reset">Cancel</button><button class="danger" data-action="reset">Stop and reset Forge</button></div></div>`;}
function resetting(){const rows=['Stop workers','Clean workspaces','Clear setup'];return heading('Reset in progress','Resetting Forge','New work is blocked while Forge stops and cleans up its resources.')+`<div class="panel" role="status" aria-live="polite">${rows.map((label,i)=>`<div class="row"><span class="status-icon ${i<s.resetIndex?'good':''}">${i<s.resetIndex?'✓':i===s.resetIndex?'<span class="spinner"></span>':'○'}</span><div class="grow"><h3>${label}</h3></div>${status(i<s.resetIndex?'Verified':i===s.resetIndex?'In progress':'Waiting',i<s.resetIndex)}</div>`).join('')}</div><p class="small muted">This reset continues if you close the page. Fresh setup becomes available after cleanup is verified.</p>`;}
function resetDone(){return '<div class="success-mark" aria-hidden="true">✓</div>'+heading('Reset complete','Forge has been reset','No workers or active connections remain. You can create a new factory from scratch.')+`<div class="notice"><span>✓</span><p><strong>Cleanup verified.</strong>Your GitHub work has been preserved.</p></div><p class="small muted">Old GitHub Apps remain registered. You can remove them on GitHub separately.</p><div class="footer"><span class="footer-note">The new factory starts with an empty active state.</span><button class="primary" data-action="setup-again">Set up Forge →</button></div>`;}
function render(focus=false){
 let route=location.hash||'#/setup/github';
 if(s.resetIndex!==null)route='#/resetting';else if(s.resetDone)route='#/reset-done';
 if(!route.startsWith('#/reset')&&!s.live){if(s.step>0&&s.apps<4)s.step=0;route=['#/setup/github','#/setup/repository','#/setup/start'][s.step];}
 if(s.live&&!route.startsWith('#/reset'))route='#/factory';
 if(location.hash!==route)history.replaceState(null,'',route);
 const solo=route.startsWith('#/reset')||s.live;$('layout').classList.toggle('solo',solo);
 $('reset-link').hidden=route==='#/resetting'||route==='#/reset-done';$('saved').textContent=s.live?'1 repository enabled':s.resetIndex!==null?'Reset in progress':s.resetDone?'Ready for fresh setup':'Draft saved on this device';
 $('steps').innerHTML=['GitHub','Repository','Start'].map((label,i)=>`<button data-step="${i}" ${i>0&&s.apps<4?'disabled':''} ${s.step===i?'aria-current="step"':''}><span class="step-number ${i===0&&s.apps===4||i===1&&s.step>1?'done':''}">${i===0&&s.apps===4||i===1&&s.step>1?'✓':i+1}</span>${label}</button>`).join('');
 $('main').innerHTML=route==='#/reset'?resetScreen():route==='#/resetting'?resetting():route==='#/reset-done'?resetDone():s.live?factory():[github,repository,start][s.step]();save();if(focus)$('screen-title')?.focus();
}
function modal(title,body,action,label,kicker=''){returnFocus=document.activeElement;$('dialog-body').innerHTML=`${kicker?`<span class="eyebrow">${kicker}</span>`:''}<h2 id="dialog-title">${title}</h2>${body}<div class="actions"><button data-action="close">Cancel</button><button class="primary" data-action="${action}">${label}</button></div>`;if(!$('dialog').open)$('dialog').showModal();}
function close(){ $('dialog').close();if(returnFocus?.isConnected)returnFocus.focus();}
function connectGithub(){const role=roleNames[s.apps];modal(`Connect the ${role.toLowerCase()}`,`<p>GitHub will ask you to create the <strong>${role} App</strong> and install it on your selected repositories.</p><p>Forge has supplied the role’s permissions and registration details. You own and can revoke the App.</p><div class="notice neutral">GitHub’s registration and installation screens are simulated here. No account or credentials are used.</div>`,'github-approved','Approve setup in GitHub',`GitHub · Role ${s.apps+1} of 4`);}
function checkSetup(){clearTimer();s.checking=true;s.ready=false;render();timer=setTimeout(()=>{s.checking=false;s.ready=true;render();},1600);}
function continueReset(){clearTimer();timer=setTimeout(()=>{s.resetIndex++;if(s.resetIndex>=3){s={...fresh(),resetDone:true};}render();if(s.resetIndex!==null)continueReset();},1000);}
const actions={
 close,github:connectGithub,
 'github-approved'(){s.apps++;close();render();if(s.apps<4)connectGithub();},
 repository(){s.step=1;go('#/setup/repository');},'start-page'(){s.step=2;go('#/setup/start');},back(){s.step=Math.max(0,s.step-1);go(['#/setup/github','#/setup/repository','#/setup/start'][s.step]);},
 provider(){modal('Connect Codex','<p>Use a supported coding-provider connection. Forge verifies authentication and model availability before starting work.</p><div class="panel"><div class="row"><span class="status-icon good">✓</span><div><h3>Demo server credentials available</h3><small>No real credentials are needed for this preview.</small></div></div></div>','provider-connected','Use demo connection','Coding provider');},
 'provider-connected'(){s.provider=true;close();checkSetup();},
 start(){if(!s.ready)return;s.live=true;go('#/factory');},
 'cancel-reset'(){go(s.live?'#/factory':['#/setup/github','#/setup/repository','#/setup/start'][s.step]);},
 reset(){clearTimer();s.resetIndex=0;s.checking=false;go('#/resetting');continueReset();},
 'setup-again'(){s=fresh();go('#/setup/github');}
};
document.addEventListener('click',e=>{const step=e.target.closest('[data-step]');if(step&&!step.disabled){s.step=Number(step.dataset.step);go(['#/setup/github','#/setup/repository','#/setup/start'][s.step]);return;}const button=e.target.closest('[data-action]');if(button&&!button.disabled)actions[button.dataset.action]?.();});
document.addEventListener('change',e=>{if(e.target.name==='repo'){s.repo=e.target.value;s.ready=false;save();if(s.provider)checkSetup();}});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close();});window.addEventListener('hashchange',()=>render(true));
render();if(s.resetIndex!==null)continueReset();else if(s.checking)checkSetup();
</script>
</body></html>
