<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">One issue, many careful steps</title><desc id="desc">An issue moves through Build, Review and Audit before completion.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
