<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc"><title id="title">Issue workbench, illustrated</title><desc id="desc">The cube shows the stage, the summary explains the last result, and the action area tells you what is needed next.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
@media(prefers-color-scheme:dark){:root{--bg:#101416;--panel:#192024;--ink:#edf1ee;--muted:#acb7b9;--line:#52636b;--mint:#234a38;--amber:#58462a}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.wire{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mint{fill:var(--mint)}.amber{fill:var(--amber)}text{font-family:system-ui,-apple-system,sans-serif;font-size:24px;fill:var(--ink)}.small{font-size:20px;fill:var(--muted)}.heading{font-size:30px;font-weight:650}.number{font-size:22px;font-weight:700;fill:#163e2d}.face{fill:none;stroke:#17313c;stroke-width:3;stroke-linecap:round}
</style><rect x="1" y="1" width="598" height="508" rx="24" class="bg"/><text x="30" y="44" class="heading" text-anchor="start">Issue workbench</text><text x="30" y="75" class="small" text-anchor="start">Screen illustration</text><rect x="30" y="101" width="540" height="214" rx="18" class="panel"/><g transform="translate(133 206) scale(0.8)"><ellipse cx="0" cy="71" rx="55" ry="10" class="mint"/><path d="M-46-12 0-38 46-12 46 40 0 66-46 40Z" fill="#ecc486" stroke="#31454f" stroke-width="2"/><path d="M-46-12 0 14 46-12 0-38Z" fill="#fff" opacity=".22"/><path d="M0 14 46-12 46 40 0 66Z" fill="#000" opacity=".1"/><path d="M-46-12 0 14 46-12M0 14V66" class="face" opacity=".3"/><circle cx="-28" cy="17" r="3.5" fill="#17313c"/><circle cx="-11" cy="26" r="3.5" fill="#17313c"/><path d="M-29 32Q-20 44-12 41" class="face"/></g><circle cx="67" cy="134" r="18" fill="#bfe6cd"/><text x="67" y="141" class="number" text-anchor="middle">1</text><rect x="235" y="127" width="307" height="153" rx="18" class="panel"/><circle cx="263" cy="150" r="18" fill="#bfe6cd"/><text x="263" y="157" class="number" text-anchor="middle">2</text><text x="269" y="198" class="" text-anchor="start">Latest summary</text><text x="257" y="235" class="small" text-anchor="start">Read what happened.</text><rect x="30" y="339" width="540" height="87" rx="18" class="amber"/><circle cx="62" cy="380" r="18" fill="#bfe6cd"/><text x="62" y="387" class="number" text-anchor="middle">3</text><text x="98" y="374" class="" text-anchor="start">Next action</text><text x="98" y="406" class="small" text-anchor="start">Check the evidence before retrying.</text><text x="30" y="467" class="small" text-anchor="start">1  Stage    2  Summary    3  Action</text></svg>
