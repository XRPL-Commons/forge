<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc"><title id="title">Read the factory line</title><desc id="desc">Numbered bays follow the productive path; attention, dependencies and holds sit alongside, not inside the success path.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
@media(prefers-color-scheme:dark){:root{--bg:#101416;--panel:#192024;--ink:#edf1ee;--muted:#acb7b9;--line:#52636b;--mint:#234a38;--amber:#58462a}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.wire{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mint{fill:var(--mint)}.amber{fill:var(--amber)}text{font-family:system-ui,-apple-system,sans-serif;font-size:24px;fill:var(--ink)}.small{font-size:20px;fill:var(--muted)}.heading{font-size:30px;font-weight:650}.number{font-size:22px;font-weight:700;fill:#163e2d}.face{fill:none;stroke:#17313c;stroke-width:3;stroke-linecap:round}
</style><rect x="1" y="1" width="598" height="558" rx="24" class="bg"/><text x="30" y="43" class="heading" text-anchor="start">Read the factory line</text><rect x="30" y="72" width="252" height="96" rx="18" class="panel"/><circle cx="58" cy="101" r="18" fill="#bfe6cd"/><text x="58" y="108" class="number" text-anchor="middle">1</text><text x="92" y="110" class="" text-anchor="start">Queued</text><text x="54" y="146" class="small" text-anchor="start">Waiting for a worker</text><rect x="318" y="72" width="252" height="96" rx="18" class="panel"/><circle cx="346" cy="101" r="18" fill="#bfe6cd"/><text x="346" y="108" class="number" text-anchor="middle">2</text><text x="380" y="110" class="" text-anchor="start">Build</text><text x="342" y="146" class="small" text-anchor="start">Make the candidate</text><rect x="30" y="188" width="252" height="96" rx="18" class="panel"/><circle cx="58" cy="217" r="18" fill="#bfe6cd"/><text x="58" y="224" class="number" text-anchor="middle">3</text><text x="92" y="226" class="" text-anchor="start">Review</text><text x="54" y="262" class="small" text-anchor="start">Check correctness</text><rect x="318" y="188" width="252" height="96" rx="18" class="panel"/><circle cx="346" cy="217" r="18" fill="#bfe6cd"/><text x="346" y="224" class="number" text-anchor="middle">4</text><text x="380" y="226" class="" text-anchor="start">Security audit</text><text x="342" y="262" class="small" text-anchor="start">Check security</text><rect x="30" y="304" width="252" height="96" rx="18" class="panel"/><circle cx="58" cy="333" r="18" fill="#bfe6cd"/><text x="58" y="340" class="number" text-anchor="middle">5</text><text x="92" y="342" class="" text-anchor="start">Waiting to merge</text><text x="54" y="378" class="small" text-anchor="start">Approval and checks</text><rect x="318" y="304" width="252" height="96" rx="18" class="panel"/><circle cx="346" cy="333" r="18" fill="#bfe6cd"/><text x="346" y="340" class="number" text-anchor="middle">6</text><text x="380" y="342" class="" text-anchor="start">Merged</text><text x="342" y="378" class="small" text-anchor="start">Observed completion</text><text x="30" y="450" class="heading" text-anchor="start">Alongside the line</text><rect x="30" y="470" width="540" height="60" rx="18" class="amber"/><text x="300" y="508" class="small" text-anchor="middle">Needs attention · Dependencies · Holds</text></svg>
