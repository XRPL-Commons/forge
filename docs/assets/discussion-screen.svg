<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc"><title id="title">Discussion, illustrated</title><desc id="desc">Presence identifies the worker, activity explains the wait, and applying a decision is an explicit separate action.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
@media(prefers-color-scheme:dark){:root{--bg:#101416;--panel:#192024;--ink:#edf1ee;--muted:#acb7b9;--line:#52636b;--mint:#234a38;--amber:#58462a}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.wire{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mint{fill:var(--mint)}.amber{fill:var(--amber)}text{font-family:system-ui,-apple-system,sans-serif;font-size:24px;fill:var(--ink)}.small{font-size:20px;fill:var(--muted)}.heading{font-size:30px;font-weight:650}.number{font-size:22px;font-weight:700;fill:#163e2d}.face{fill:none;stroke:#17313c;stroke-width:3;stroke-linecap:round}
</style><rect x="1" y="1" width="598" height="538" rx="24" class="bg"/><text x="30" y="44" class="heading" text-anchor="start">Discussion</text><text x="30" y="75" class="small" text-anchor="start">Screen illustration</text><rect x="30" y="102" width="540" height="397" rx="18" class="panel"/><circle cx="62" cy="139" r="18" fill="#bfe6cd"/><text x="62" y="146" class="number" text-anchor="middle">1</text><text x="98" y="147" class="" text-anchor="start">Ember · Claude</text><rect x="61" y="178" width="478" height="72" rx="18" class="panel"/><text x="83" y="208" class="small" text-anchor="start">Reading the issue…</text><text x="83" y="235" class="small" text-anchor="start">Activity explains the wait.</text><circle cx="62" cy="292" r="18" fill="#bfe6cd"/><text x="62" y="299" class="number" text-anchor="middle">2</text><text x="98" y="299" class="" text-anchor="start">Answer and proposed decision</text><text x="98" y="337" class="small" text-anchor="start">A suggestion changes nothing yet.</text><circle cx="62" cy="413" r="18" fill="#bfe6cd"/><text x="62" y="420" class="number" text-anchor="middle">3</text><rect x="98" y="384" width="391" height="61" rx="18" class="mint"/><text x="292" y="423" class="" text-anchor="middle">Apply this decision</text><text x="98" y="476" class="small" text-anchor="start">Forge checks the current issue again.</text></svg>
