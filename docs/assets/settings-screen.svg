<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">Repository setup, illustrated</title><desc id="desc">Choose a repository, confirm four App installations, inspect review rules, and enable automation explicitly.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
@media(prefers-color-scheme:dark){:root{--bg:#101416;--panel:#192024;--ink:#edf1ee;--muted:#acb7b9;--line:#52636b;--mint:#234a38;--amber:#58462a}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.wire{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mint{fill:var(--mint)}.amber{fill:var(--amber)}text{font-family:system-ui,-apple-system,sans-serif;font-size:24px;fill:var(--ink)}.small{font-size:20px;fill:var(--muted)}.heading{font-size:30px;font-weight:650}.number{font-size:22px;font-weight:700;fill:#163e2d}.face{fill:none;stroke:#17313c;stroke-width:3;stroke-linecap:round}
</style><rect x="1" y="1" width="598" height="588" rx="24" class="bg"/><text x="30" y="44" class="heading" text-anchor="start">Repository setup</text><text x="30" y="75" class="small" text-anchor="start">Screen illustration</text><rect x="30" y="101" width="540" height="451" rx="18" class="panel"/><circle cx="65" cy="144" r="18" fill="#bfe6cd"/><text x="65" y="151" class="number" text-anchor="middle">1</text><text x="98" y="152" class="" text-anchor="start">Repository</text><text x="98" y="187" class="small" text-anchor="start">Choose the shared repository</text><circle cx="65" cy="239" r="18" fill="#bfe6cd"/><text x="65" y="246" class="number" text-anchor="middle">2</text><text x="98" y="247" class="" text-anchor="start">App access</text><text x="98" y="282" class="small" text-anchor="start">All four installations need access</text><circle cx="65" cy="334" r="18" fill="#bfe6cd"/><text x="65" y="341" class="number" text-anchor="middle">3</text><text x="98" y="342" class="" text-anchor="start">Review rules</text><text x="98" y="377" class="small" text-anchor="start">Repair, then check again</text><circle cx="65" cy="459" r="18" fill="#bfe6cd"/><text x="65" y="466" class="number" text-anchor="middle">4</text><rect x="98" y="431" width="363" height="57" rx="18" class="mint"/><text x="280" y="468" class="" text-anchor="middle">Enable automation</text><text x="98" y="525" class="small" text-anchor="start">This is the step that starts work.</text></svg>
