<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Issues, illustrated</title><desc id="desc">Read a main status separately from its reason; open an issue to see evidence and actions.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
@media(prefers-color-scheme:dark){:root{--bg:#101416;--panel:#192024;--ink:#edf1ee;--muted:#acb7b9;--line:#52636b;--mint:#234a38;--amber:#58462a}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.wire{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mint{fill:var(--mint)}.amber{fill:var(--amber)}text{font-family:system-ui,-apple-system,sans-serif;font-size:24px;fill:var(--ink)}.small{font-size:20px;fill:var(--muted)}.heading{font-size:30px;font-weight:650}.number{font-size:22px;font-weight:700;fill:#163e2d}.face{fill:none;stroke:#17313c;stroke-width:3;stroke-linecap:round}
</style><rect x="1" y="1" width="598" height="488" rx="24" class="bg"/><text x="30" y="44" class="heading" text-anchor="start">Issues</text><text x="30" y="75" class="small" text-anchor="start">Screen illustration</text><rect x="30" y="102" width="540" height="276" rx="18" class="panel"/><text x="55" y="142" class="" text-anchor="start">Repository  /  issue title</text><circle cx="62" cy="192" r="18" fill="#bfe6cd"/><text x="62" y="199" class="number" text-anchor="middle">1</text><rect x="96" y="168" width="206" height="42" rx="18" class="mint"/><text x="120" y="197" class="" text-anchor="start">Working</text><circle cx="62" cy="247" r="18" fill="#bfe6cd"/><text x="62" y="254" class="number" text-anchor="middle">2</text><text x="96" y="254" class="small" text-anchor="start">In review</text><path d="M49 287H550" class="wire"/><text x="57" y="329" class="small" text-anchor="start">Open an issue for the workbench</text><text x="30" y="420" class="small" text-anchor="start">1  Main status: the same across views</text><text x="30" y="454" class="small" text-anchor="start">2  Reason: the specific next condition</text></svg>
