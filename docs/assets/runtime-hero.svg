<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title desc"><title id="title">Room to work, clear boundaries</title><desc id="desc">An isolated worker has a workspace and finite memory; its supervisor controls admission and merge outside the sandbox.</desc><style>
:root{color-scheme:light dark;--bg:#f2f6f3;--panel:#ffffff;--ink:#1d3035;--muted:#4d646b;--line:#8ca2a5;--mint:#d5efde;--amber:#f8e2b9}
@media(prefers-color-scheme:dark){:root{--bg:#101416;--panel:#192024;--ink:#edf1ee;--muted:#acb7b9;--line:#52636b;--mint:#234a38;--amber:#58462a}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.wire{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.mint{fill:var(--mint)}.amber{fill:var(--amber)}text{font-family:system-ui,-apple-system,sans-serif;font-size:24px;fill:var(--ink)}.small{font-size:20px;fill:var(--muted)}.heading{font-size:30px;font-weight:650}.number{font-size:22px;font-weight:700;fill:#163e2d}.face{fill:none;stroke:#17313c;stroke-width:3;stroke-linecap:round}
</style><rect x="1" y="1" width="598" height="348" rx="24" class="bg"/><text x="30" y="46" class="heading" text-anchor="start">Room to work, clear boundaries</text><rect x="28" y="80" width="330" height="230" rx="18" class="panel"/><text x="193" y="120" class="" text-anchor="middle">Worker sandbox</text><g transform="translate(194 204) scale(0.82)"><ellipse cx="0" cy="71" rx="55" ry="10" class="mint"/><path d="M-46-12 0-38 46-12 46 40 0 66-46 40Z" fill="#4fc3d6" stroke="#31454f" stroke-width="2"/><path d="M-46-12 0 14 46-12 0-38Z" fill="#fff" opacity=".22"/><path d="M0 14 46-12 46 40 0 66Z" fill="#000" opacity=".1"/><path d="M-46-12 0 14 46-12M0 14V66" class="face" opacity=".3"/><circle cx="-28" cy="17" r="3.5" fill="#17313c"/><circle cx="-11" cy="26" r="3.5" fill="#17313c"/><path d="M-29 32Q-20 44-12 41" class="face"/></g><rect x="387" y="92" width="183" height="87" rx="18" class="mint"/><text x="478" y="128" class="" text-anchor="middle">Memory</text><text x="478" y="157" class="small" text-anchor="middle">Reserved</text><rect x="387" y="198" width="183" height="87" rx="18" class="panel"/><text x="478" y="234" class="" text-anchor="middle">Account</text><text x="478" y="263" class="small" text-anchor="middle">Available</text><path d="M359 160H385M359 240H385" class="wire"/></svg>
