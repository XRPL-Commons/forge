[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent-client"
version = "0.1.0"
description = "Local agent connections to an existing Forge server"
requires-python = ">=3.10"
dependencies = ["keyring>=25,<26"]

[project.scripts]
forge = "forge_client.cli:main"

[tool.setuptools.packages.find]
include = ["forge_client*"]
