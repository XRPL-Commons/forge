# Image-owned policy. Worker repositories cannot replace or expand it.
default_permissions = "forge_runner"
allowed_approval_policies = ["never"]
allowed_web_search_modes = []
allow_login_shell = false
allow_managed_hooks_only = true
allow_remote_control = false
allow_appshots = false
[allowed_permission_profiles]
forge_runner = true
[permissions.filesystem]
deny_read = ["/work/credentials.json"]
[permissions.forge_runner.filesystem]
":root" = "deny"
":minimal" = "read"
"/usr" = "read"
"/opt/forge" = "read"
# Read-only resource telemetry, never process environments or descriptors.
"/proc/self/statm" = "read"
"/proc/meminfo" = "read"
"/sys/fs/cgroup" = "read"
"/work/repository" = "write"
# This is a disposable clone. Builders must update its index, refs and objects
# to commit their work; workspace write alone keeps .git read-only in Codex.
"/work/repository/.git" = "write"
"/work/repository/.codex" = "read"
"/work/repository/.agents" = "read"
"/run/forge-input" = "read"
"/work/home" = "deny"
# Codex exec adds its generated launcher directory to the tool environment.
# It contains executable shims, never provider authentication. Keep every other
# home path denied by this image-owned, exclusively allowed profile. A second
# deny_read mask on auth.json conflicts with its already-hidden parent in bwrap.
"/work/home/.codex/tmp/arg0" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
[permissions.forge_runner.network]
enabled = true
[features]
apps = false
plugins = false
remote_plugin = false
hooks = false
shell_snapshot = false
multi_agent = false
multi_agent_v2 = false
browser_use = false
computer_use = false
skill_mcp_dependency_install = false
request_permissions_tool = false
