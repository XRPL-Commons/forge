# Trusted setup/login probes use this bridge. Ordinary jobs get isolated per-job
# bridges and gateways from WorkerBoundary; they never join forge-workers.
services:
  egress:
    image: ${FORGE_EGRESS_IMAGE:-python:3.12-slim}
    command: ["python3", "-I", "/opt/forge/egress.py"]
    # Setup passes the service account's uid:gid: it owns the private egress.py.
    user: "${FORGE_EGRESS_USER:-1000:1000}"
    healthcheck:
      test: ["CMD", "python3", "-I", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    volumes:
      - ./egress.py:/opt/forge/egress.py:ro
    networks:
      workers:
        aliases: [forge-egress]
      uplink: {}
networks:
  workers:
    name: forge-workers
    internal: true
  uplink:
    name: forge-uplink
