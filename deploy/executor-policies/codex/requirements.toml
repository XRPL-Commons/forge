# STAGED: mount this directory read-only at /etc/codex in the attempt namespace.
default_permissions = "forge_dummy_executor"
allowed_approval_policies = ["never"]
allowed_web_search_modes = []
allow_login_shell = false
allow_managed_hooks_only = true
allow_remote_control = false
allow_appshots = false
[allowed_permission_profiles]
forge_dummy_executor = true
[permissions.filesystem]
deny_read = ["/home/forge/client", "/root", "/var/lib/forge-clients", "/run/user"]
[permissions.forge_dummy_executor]
extends = ":read-only"
[permissions.forge_dummy_executor.filesystem]
":root" = "deny"
":minimal" = "read"
"/opt/forge/bin/codex" = "read"
"/home/forge/workspace" = "write"
"/home/forge/client" = "deny"
":tmpdir" = "deny"
":slash_tmp" = "deny"
[permissions.forge_dummy_executor.network]
enabled = false

[features]
apps = false
plugins = false
remote_plugin = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
in_app_browser = false
computer_use = false
in_app_local_automation = false
code_mode = false
code_mode_host = false
multi_agent = false
multi_agent_v2 = false
hooks = false
shell_snapshot = false
image_generation = false
view_image = false
skill_mcp_dependency_install = false
skill_search = false
request_permissions_tool = false

[mcp_servers]
[plugins]
