<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge · Issues</title><style>
:root{color-scheme:dark;--bg:#101416;--panel:#192024;--line:#303b40;--text:#edf1ee;--muted:#acb7b9;--green:#bfe6cd;--blue:#abcfff;--amber:#ecc486}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:32px}h1{font-size:32px;letter-spacing:-.7px;margin:0 0 8px}h2{font-size:23px;line-height:1.3;margin:12px 0}h3{font-size:15px;margin:0 0 8px}p{margin:8px 0}.muted,small{color:var(--muted)}a{color:var(--blue);text-underline-offset:4px}.heading,.filters,.pagination,.actions,.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:1.4px;color:var(--green);font-weight:650;margin:0 0 8px}.filters{justify-content:flex-start;margin:28px 0 18px;gap:12px}button,input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 13px}button{cursor:pointer}button:hover:not(:disabled),a.button:hover{border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}.button{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:10px 13px}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0}.icon-button svg{width:20px;height:20px;pointer-events:none}.primary{background:var(--green);color:#15251b;border-color:var(--green);font-weight:650}:focus-visible{outline:2px solid var(--blue);outline-offset:4px}.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.filters label:first-child{flex:1;min-width:210px}.filters input{width:100%}.filters select,.filters .select-menu{min-width:150px}.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;font-weight:500;color:var(--muted);padding:14px 20px;border-bottom:1px solid var(--line)}td{padding:18px 20px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}td:first-child{width:54%}td:nth-child(2){width:32%}td:last-child{text-align:right;white-space:nowrap}.issue-title{display:block;color:var(--text);text-decoration:none;font-weight:600;line-height:1.4;margin:3px 0;overflow-wrap:anywhere}.issue-title:hover{color:var(--blue)}.issue-meta{font-size:12px;color:var(--muted)}.state{display:inline-flex;align-items:center;gap:7px;font-size:13px}.state::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.state.attention{color:var(--amber)}.state.working,.state.completed{color:var(--green)}.state.queued{color:var(--blue)}.reason{font-size:12px;color:var(--muted);margin-top:5px;max-width:360px}.row-action{font-size:13px;min-height:34px;padding:5px 11px}.pagination{margin:16px 0;font-size:13px;color:var(--muted)}.pagination .actions{gap:8px}.empty{padding:40px 24px;text-align:center}.freshness{font-size:13px;color:var(--muted);min-height:22px;margin:10px 0}.warning{color:var(--amber)}[hidden]{display:none!important}dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(720px,100%);max-width:100%;height:100dvh;max-height:100dvh;box-sizing:border-box;border:0;border-left:1px solid var(--line);padding:30px;background:var(--bg);color:var(--text);overflow:auto}html:has(dialog[open]){overflow:hidden}dialog::backdrop{background:#0008}.close{width:44px;height:44px;padding:0;font-size:25px;background:transparent}.detail-heading{align-items:flex-start}.detail-heading>div{min-width:0;flex:1}#detail-title{overflow-wrap:anywhere}#detail-description{overflow-wrap:anywhere;font:inherit;color:var(--muted);line-height:1.7;margin:24px 0}#detail-actions{justify-content:flex-start;margin:18px 0}.summary{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;margin:22px 0}.decision{border:1px solid #53695b;border-radius:10px;padding:18px;margin:20px 0}.decision label{display:block;font-size:13px;margin:16px 0 5px}.decision textarea{display:block;width:100%;min-height:80px;resize:vertical}.decision .actions{justify-content:flex-end;margin-top:16px}details{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;font-size:13px;color:var(--muted)}summary{cursor:pointer;color:var(--text)}.history{list-style:none;padding:0}.history li{border-left:1px solid var(--line);padding:0 0 15px 15px;margin:0}.history time{font-size:12px;display:block;color:var(--muted)}#detail-links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}#detail-dependencies a{display:inline-block;margin-right:12px}#detail-message{color:var(--amber)}
@media(max-width:700px){main{padding:24px 18px}h1{font-size:29px}.filters{gap:10px}.filters label:first-child{flex-basis:100%}.filters label:not(:first-child){flex:1}.filters select,.filters .select-menu{min-width:0;width:100%}button,input,select,textarea{font-size:16px;min-height:44px}table,tbody,tr,td{display:block}thead{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}tr{display:grid;grid-template-columns:1fr auto;padding:16px;gap:12px;border-bottom:1px solid var(--line)}tr:last-child{border:0}td,td:first-child,td:nth-child(2){width:auto;padding:0;border:0;min-width:0}td:first-child{grid-column:1/-1}td:last-child{align-self:center}.row-action{min-height:44px}dialog{padding:22px 18px}.reason{max-width:none}.pagination{align-items:flex-start}.pagination button{font-size:13px}.filters label{min-width:0}.heading{align-items:flex-start}}
#detail-description>:first-child{margin-top:0}#detail-description h1,#detail-description h2,#detail-description h3,#detail-description h4{color:var(--text);line-height:1.4;letter-spacing:normal;margin:28px 0 12px}#detail-description h1{font-size:23px}#detail-description h2{font-size:20px}#detail-description h3{font-size:17px}#detail-description p{margin:14px 0}#detail-description ul,#detail-description ol{padding-left:24px;margin:14px 0}#detail-description li{margin:6px 0}#detail-description code{font:13px/1.6 ui-monospace,monospace;background:#20292e;border-radius:4px;padding:2px 5px;overflow-wrap:anywhere}#detail-description pre{max-width:100%;overflow:auto;background:#192024;border:1px solid var(--line);border-radius:8px;padding:14px}#detail-description pre code{padding:0;background:none;white-space:pre;overflow-wrap:normal}#detail-description blockquote{margin:16px 0;padding:1px 16px;border-left:3px solid #526269}#detail-description table{display:block;overflow:auto;font-size:13px}#detail-description th,#detail-description td{width:auto!important;padding:8px 12px;border:1px solid var(--line);white-space:normal;text-align:left}#detail-description tr{display:table-row;padding:0}#detail-description tbody{display:table-row-group}#detail-description td{display:table-cell}#detail-description thead{position:static;width:auto;height:auto;clip-path:none;display:table-header-group}#detail-description input[type=checkbox]{min-height:0;width:14px;height:14px;padding:0;vertical-align:middle}#detail-description hr{border:0;border-top:1px solid var(--line);margin:24px 0}
</style></head><body><!--FORGE_NAVIGATION--><main><div class="heading"><div><p class="eyebrow">Your work</p><h1>Issues</h1><p class="muted">Choose what Forge should work on. Review anything that needs a decision.</p></div><button class="icon-button" id="refresh" aria-label="Refresh issues" title="Refresh issues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div>
<div class="filters"><label>Find an issue<input type="search" id="search" placeholder="Title, repository or issue number" autocomplete="off"></label><label>Repository<select id="repository" aria-label="Repository"><option value="">All repositories</option></select></label><label>Show<select id="state" aria-label="Show"><option value="open">Open issues</option><option value="attention">Needs attention</option><option value="backlog">Backlog</option><option value="queued">Queued</option><option value="working">Working</option><option value="waiting">Waiting</option><option value="completed">Completed</option></select></label></div>
<p class="freshness" id="freshness" role="status">Loading issues…</p><div class="list"><table aria-label="Issues"><thead><tr><th scope="col">Issue</th><th scope="col">Status</th><th scope="col"><span>Next step</span></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden><h3 id="empty-title">No issues in this view</h3><p class="muted" id="empty-description">Try another filter.</p><a id="add-repository" href="/settings/repository" hidden>Add repository →</a></div></div><div class="pagination"><span id="count"></span><div class="actions"><button id="previous" disabled>Previous</button><button id="next" disabled>Next</button></div></div></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-heading"><div><span class="issue-meta" id="detail-meta"></span><h2 id="detail-title">Loading issue…</h2></div><button class="close" id="close" aria-label="Close issue">×</button></div><div id="detail-links"></div><section class="summary"><span id="detail-state" class="state"></span><p id="detail-explanation"></p><div id="detail-dependencies"></div><div id="detail-reviews" class="muted"></div><div class="actions" id="detail-actions"></div></section><p id="detail-message" role="status"></p><section class="decision" id="decision" hidden><h3 id="decision-title"></h3><p id="decision-effect" class="muted"></p><label id="decision-label" for="reason">What changed?</label><textarea id="reason"></textarea><div class="actions"><button id="cancel">Cancel</button><button class="primary" id="confirm">Confirm</button></div></section><div id="detail-description"></div><details><summary>Recent activity</summary><ol class="history" id="history"></ol></details></dialog><script src="/assets/vendor/marked.umd.js"></script><script src="/assets/vendor/purify.min.js"></script><script src="/assets/markdown.js"></script><script src="/assets/issues.js"></script></body></html>
