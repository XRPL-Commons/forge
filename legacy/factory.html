<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge · Factory</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#101416;color:#e8edf0}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:auto;padding:28px}header,.row,footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}a{color:#9bc5ff}h1{margin:0;font-size:28px}h2{font-size:18px}h3{font-size:15px;margin:10px 0;overflow-wrap:anywhere}.muted,small{color:#a7b0b8}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:24px 0}.column,section{padding:18px;background:#191e21;border:1px solid #303940;border-radius:12px}.column[data-role=build]{border-top:3px solid #80adff}.column[data-role=review]{border-top:3px solid #bf98ed}.column[data-role=audit]{border-top:3px solid #72d1bb}article{padding:16px;border:1px solid #39434b;border-radius:8px;margin:12px 0;background:#1e252a}article.active{border-color:#99bbef}.column[data-role=review] article.active{border-color:#bf98ed}.column[data-role=audit] article.active{border-color:#72d1bb}footer{padding-top:12px;margin-top:12px;border-top:1px solid #39434b;justify-content:flex-end}button,input,textarea{font:inherit;color:inherit;background:#13191d;border:1px solid #44515b;border-radius:6px;padding:7px 11px}button{cursor:pointer}button:hover{border-color:#a6cfff}button:focus-visible,a:focus-visible{outline:2px solid #a6cfff;outline-offset:3px}.attention{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;align-items:start}.attention article{border-color:#d9ad67;margin:0}#notice{color:#f0bf77;min-height:24px}dialog{background:#1b2227;color:inherit;border:1px solid #50616d;border-radius:12px;max-width:760px;width:calc(100% - 36px);max-height:85vh;padding:24px}dialog::backdrop{background:#000a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}input{width:100%}#reason-label{display:block;margin:16px 0}section{margin:24px 0}details{margin:12px 0}summary{cursor:pointer}@media(max-width:850px){main{padding:18px}.columns{grid-template-columns:1fr}}
</style></head><body><main><header><div><h1>Factory</h1><p class="muted" id="status">Loading…</p></div><div><a href="/settings/harnesses">Coding accounts</a> · <a href="/settings">Settings</a></div></header><p id="notice" role="status"></p><p id="empty-state" class="muted" hidden></p><div class="columns" id="columns"></div><section><h2 id="attention-title">Needs attention</h2><div class="attention" id="attention"></div></section><details><summary>Runner cleanup and investigations</summary><div id="runners"></div></details><details><summary>Completed issues</summary><div id="completed"></div></details></main>
<dialog id="dialog"><h2 id="dialog-title"></h2><p id="explanation"></p><pre id="content"></pre><label id="reason-label" hidden>Decision or reason<input id="reason" autocomplete="off"></label><footer><button id="close">Close</button><button id="confirm" hidden>Confirm</button></footer></dialog>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,pending=null;
const names={build:'Build',review:'Review',audit:'Security audit'};
function card(i){const j=state.jobs.find(j=>j.id===i.active),pr=i.candidate?.pr;return `<article class="${j?'active':''}"><div class="row"><small>${esc(i.repo)} · #${i.number}</small><small>${j?esc(j.role)+' · '+esc(j.phase):esc(i.state.replaceAll('_',' '))}</small></div><h3>${esc(i.title||'Issue #'+i.number)}</h3>${j?.provider_id?`<small>${esc(j.provider)} · ${esc(j.model||'Default model')}</small>`:''}<p><a href="https://github.com/${esc(i.repo)}/issues/${i.number}" target="_blank" rel="noopener noreferrer">Issue #${i.number} ↗</a>${pr?` · <a href="https://github.com/${esc(i.repo)}/pull/${pr}" target="_blank" rel="noopener noreferrer">PR #${pr} ↗</a>`:''}</p>${i.reason?`<p>${esc(String(i.reason).slice(0,240))}</p>`:''}${i.failure_count?`<small>${i.failure_count} / 3 failures</small>`:''}<footer><button data-details="${esc(i.key)}">History</button>${j&&j.role!=='merge'?`<button data-output="${j.id}">Output</button><button data-action="stop" data-target="${j.id}">Stop</button>`:''}${['failed','hold','cancelled'].includes(i.state)?`<button data-action="retry" data-target="${esc(i.key)}">Retry</button>`:''}</footer></article>`}
function render(){
const fault=state.observation?.errors?.[0];if(fault)$('notice').textContent=fault.reason;
const empty=state.active&&state.runtime.enabled&&!state.issues.length&&!fault;$('empty-state').hidden=!empty;if(empty)$('empty-state').innerHTML='Waiting for a ready issue. Add the ready label to an issue to queue it. '+(state.repositories||[]).filter(r=>r.enabled).map(r=>`<a href="https://github.com/${esc(r.name)}/issues" target="_blank" rel="noopener noreferrer">${esc(r.name)} issues ↗</a>`).join(' · ');
const rejected=(state.actions||[]).filter(a=>a.status==='rejected').at(-1);if(rejected)$('notice').textContent='Action could not be applied: '+rejected.error;
$('status').textContent=`${state.active?'New controller selected':'Preview · legacy controller selected'} · ${state.runtime.enabled?'dispatch enabled':'dispatch paused'} · ${Object.keys(state.slots).length} occupied ${Object.keys(state.slots).length===1?'runner':'runners'}`;
const assigned=new Set();$('columns').innerHTML=Object.entries(names).map(([role,name])=>{const items=state.issues.filter(i=>{const j=state.jobs.find(j=>j.id===i.active);return j?j.role===role:({ready:'build',built:'review',reviewed:'audit'})[i.state]===role});items.forEach(i=>assigned.add(i.key));return `<div class="column" data-role="${role}"><div class="row"><h2>${name}</h2><small>${items.length} ${items.length===1?'issue':'issues'} · ${state.runtime.slots[role]} slots</small></div>${items.map(card).join('')||'<p class="muted">Empty</p>'}</div>`}).join('');
const attention=state.issues.filter(i=>!assigned.has(i.key)&&['failed','hold','approval_needed'].includes(i.state));$('attention-title').textContent=`Needs attention · ${attention.length}`;$('attention').innerHTML=attention.map(card).join('')||'<p class="muted">No issues need attention.</p>';
$('completed').innerHTML=state.issues.filter(i=>['merged','cancelled'].includes(i.state)).map(card).join('')||'<p class="muted">No completed issues yet.</p>';
$('runners').innerHTML=state.issues.filter(i=>['investigating','audited'].includes(i.state)).map(card).join('')+state.jobs.filter(j=>j.role==='recovery'||!state.issues.some(i=>i.active===j.id)).map(j=>`<article><div class="row"><span>${esc(j.role)} · ${esc(j.slot)} · ${esc(j.phase)}</span><span><button data-output="${j.id}">Output</button> <button data-action="reset" data-target="${j.id}">Reset</button></span></div></article>`).join('')||'<p class="muted">No cleanup or investigations pending.</p>';
}
async function request(path,body){const options={signal:AbortSignal.timeout(15000),credentials:'same-origin'};if(body!==undefined)Object.assign(options,{method:'POST',headers:{'Content-Type':'application/json','X-Forge-Action':state.controls_token},body:JSON.stringify(body)});const response=await fetch(path,options);if(!response.ok)throw Error(`Request failed (${response.status})`);const value=await response.json();if(!value.ok)throw Error(value.reason||'Operation unavailable');return value}
async function refresh(){state=await request('/api/factory');render()}
function dialog(title,text,content=''){pending=null;$('dialog-title').textContent=title;$('explanation').textContent=text;$('content').textContent=content;$('reason-label').hidden=true;$('confirm').hidden=true;$('dialog').showModal()}
document.addEventListener('click',async e=>{try{const b=e.target.closest('button');if(!b)return;if(b.dataset.details){const i=state.issues.find(i=>i.key===b.dataset.details);dialog('Issue history',i.reason||i.state,JSON.stringify({events:i.history||[],failures:i.failures},null,2));}else if(b.dataset.output){const v=await request('/api/factory/output?id='+encodeURIComponent(b.dataset.output));dialog('Worker output','',v.logs||'No captured output is available yet.');}else if(b.dataset.action){const action=b.dataset.action;dialog(action==='retry'?'Retry issue?':action==='stop'?'Stop this attempt?':'Reset runner?',action==='retry'?'This grants a new three-failure budget and sends the issue to Build. Existing history is preserved. Explain what has changed.':action==='stop'?'This cancels the issue’s active attempt, discards unfinished workspace edits, and resets its runner. Published PRs are preserved.':'This terminates the old execution and discards its disposable workspace. Capacity is released only after teardown is verified.');pending={action,target:b.dataset.target};$('reason').value='';$('reason-label').hidden=false;$('confirm').hidden=false;$('confirm').textContent=action==='retry'?'Retry issue':action==='stop'?'Stop attempt':'Reset runner';}}catch(error){$('notice').textContent=error.message}});
$('close').onclick=()=>$('dialog').close();$('confirm').onclick=async()=>{if(!pending||!$('reason').value.trim())return;try{await request('/api/factory/action',{...pending,reason:$('reason').value.trim()});$('dialog').close();$('notice').textContent='Action queued for the supervisor.';await refresh()}catch(error){$('explanation').textContent=error.message}};
refresh().catch(e=>$('notice').textContent=e.message);setInterval(()=>{if(!$('dialog').open)refresh().catch(e=>$('notice').textContent=e.message)},5000);
</script></body></html>
